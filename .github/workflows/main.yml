name: Validar EcoColecta

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validación de JavaScript
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4
      - name: Verificar sintaxis de JavaScript
        run: node --check app.js
      - name: Verificar errores de whitespace
        run: git diff --check
